  <div class="carousel-wrap" id="sa-carousel">
    <div class="carousel-main">
      <div class="carousel-slide active"><img src="../images/structure-abandonment/01.jpg" alt="Interior of an industrial warehouse, black and white" width="2200" height="1464"></div>
      <div class="carousel-slide"><img src="../images/structure-abandonment/02.jpg" alt="Harbor with a gantry crane, seen from above, black and white" width="2200" height="1487" loading="lazy"></div>
      <div class="carousel-slide"><img src="../images/structure-abandonment/03.jpg" alt="Concrete pier pillars standing in still water, black and white" width="2200" height="1476" loading="lazy"></div>
      <div class="carousel-slide"><img src="../images/structure-abandonment/04.jpg" alt="Angular modernist building exterior, black and white" width="2200" height="1469" loading="lazy"></div>
      <div class="carousel-slide"><img src="../images/structure-abandonment/05.jpg" alt="Brutalist concrete walls in a courtyard, black and white" width="2200" height="1469" loading="lazy"></div>
      <button class="carousel-btn prev" aria-label="Previous">&#8249;</button>
      <button class="carousel-btn next" aria-label="Next">&#8250;</button>
    </div>
    <div class="carousel-thumbs">
      <button class="carousel-thumb active" aria-label="Show image 1"><img src="../images/structure-abandonment/thumbs/01.jpg" alt="" loading="lazy"></button>
      <button class="carousel-thumb" aria-label="Show image 2"><img src="../images/structure-abandonment/thumbs/02.jpg" alt="" loading="lazy"></button>
      <button class="carousel-thumb" aria-label="Show image 3"><img src="../images/structure-abandonment/thumbs/03.jpg" alt="" loading="lazy"></button>
      <button class="carousel-thumb" aria-label="Show image 4"><img src="../images/structure-abandonment/thumbs/04.jpg" alt="" loading="lazy"></button>
      <button class="carousel-thumb" aria-label="Show image 5"><img src="../images/structure-abandonment/thumbs/05.jpg" alt="" loading="lazy"></button>
    </div>
  </div>

  <script>
    function initCarousel(id) {
      const wrap = document.getElementById(id);
      if (!wrap) return;
      const slides = wrap.querySelectorAll('.carousel-slide');
      const thumbs = wrap.querySelectorAll('.carousel-thumb');
      let current = 0;
      function show(index) {
        slides[current].classList.remove('active');
        thumbs[current].classList.remove('active');
        current = (index + slides.length) % slides.length;
        slides[current].classList.add('active');
        thumbs[current].classList.add('active');
      }
      wrap.querySelector('.carousel-btn.prev').addEventListener('click', () => show(current - 1));
      wrap.querySelector('.carousel-btn.next').addEventListener('click', () => show(current + 1));
      thumbs.forEach((t, i) => t.addEventListener('click', () => show(i)));
      document.addEventListener('keydown', (e) => {
        const r = wrap.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });
    }
    initCarousel('sa-carousel');
  </script>
